<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - WallApp</title>

    <style>
        /* LOCAL FONTS */
        @font-face {
          font-family: 'Instrument Serif';
          src: url('./fonts/InstrumentSerif-Regular.woff2') format('woff2');
          font-weight: 400;
          font-style: normal;
          font-display: swap;
        }

        @font-face {
          font-family: 'Instrument Serif';
          src: url('./fonts/InstrumentSerif-Italic.woff2') format('woff2');
          font-weight: 400;
          font-style: italic;
          font-display: swap;
        }

        @font-face {
          font-family: 'Monsieur La Doulaise';
          src: url('./fonts/MonsieurLaDoulaise-Regular.woff2') format('woff2');
          font-weight: 400;
          font-style: normal;
          font-display: swap;
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          --bg-primary: #ffffff;
          --bg-secondary: #f5f5f5;
          --text-primary: #000000;
          --text-secondary: #666666;
          --border: #e0e0e0;
          --shadow: rgba(0, 0, 0, 0.08);
        }

        body.dark-mode {
          --bg-primary: #000000;
          --bg-secondary: #1a1a1a;
          --text-primary: #ffffff;
          --text-secondary: #999999;
          --border: #333333;
          --shadow: rgba(255, 255, 255, 0.05);
        }

        body {
          font-family: 'Instrument Serif', serif;
          background: var(--bg-primary);
          color: var(--text-primary);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        }

        .navbar {
          background: var(--bg-primary);
          border-bottom: 1px solid var(--border);
          padding: 1rem 2rem;
        }

        .navbar-container {
          max-width: 1400px;
          margin: 0 auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .logo {
          font-family: 'Monsieur La Doulaise', cursive;
          font-size: 2.5rem;
          color: var(--text-primary);
          text-decoration: none;
        }

        .theme-toggle {
          background: var(--bg-secondary);
          border: 1px solid var(--border);
          color: var(--text-primary);
          cursor: pointer;
          padding: 0.6rem;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 40px;
          height: 40px;
        }

        .main-content {
          flex: 1;
          max-width: 1400px;
          margin: 0 auto;
          padding: 2rem;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }

        .offline-container {
          text-align: center;
          max-width: 500px;
          animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(20px);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        .offline-icon {
          width: 120px;
          height: 120px;
          margin: 0 auto 2rem;
          animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

          0%,
          100% {
            opacity: 0.5;
          }

          50% {
            opacity: 1;
          }
        }

        .offline-container h1 {
          font-size: 2.5rem;
          margin-bottom: 1rem;
          color: var(--text-primary);
        }

        .offline-container p {
          font-size: 1.125rem;
          color: var(--text-secondary);
          margin-bottom: 2rem;
          line-height: 1.6;
        }

        .retry-btn {
          background: var(--text-primary);
          color: var(--bg-primary);
          border: none;
          padding: 1rem 2rem;
          border-radius: 8px;
          cursor: pointer;
          font-size: 1rem;
          font-weight: 600;
          font-family: 'Instrument Serif', serif;
          transition: all 0.3s ease;
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
        }

        .retry-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 4px 12px var(--shadow);
        }

        .bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: var(--bg-primary);
          border-top: 1px solid var(--border);
          display: flex;
          justify-content: space-around;
          padding: 1rem;
          box-shadow: 0 -2px 12px var(--shadow);
        }

        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.25rem;
          color: var(--text-secondary);
          text-decoration: none;
          padding: 0.5rem 1rem;
          border-radius: 8px;
          font-size: 0.875rem;
        }

        @media (max-width: 768px) {
          .navbar {
            padding: 1rem;
          }

          .logo {
            font-size: 2rem;
          }

          .main-content {
            padding: 1rem;
          }

          .offline-container h1 {
            font-size: 2rem;
          }

          .offline-icon {
            width: 80px;
            height: 80px;
          }
        }
    </style>
</head>

<body>
<nav class="navbar">
    <div class="navbar-container">
        <a href="/" class="logo">WallApp</a>
        <button class="theme-toggle" onclick="toggleDarkMode()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>
</nav>

<main class="main-content">
    <div class="offline-container">
        <svg class="offline-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>

        <h1>You're Offline</h1>
        <p>Looks like you've lost your internet connection. Check your network settings and try again.</p>

        <button class="retry-btn" onclick="location.reload()">
            Retry
        </button>
    </div>
</main>



<script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }

    window.addEventListener('online', () => location.reload());
</script>
</body>

</html>
